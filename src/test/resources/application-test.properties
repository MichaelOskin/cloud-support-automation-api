# ==================================
# =  TEST-SPECIFIC PROPERTIES      =
# ==================================
# These properties are loaded when the 'test' profile is active.

# ==================================
# =      DATABASE CONFIGURATION    =
# ==================================
# Use Testcontainers to automatically start a PostgreSQL container for tests.
spring.datasource.url=jdbc:tc:postgresql:15-alpine:///cloud_support_automation_test
spring.datasource.username=test
spring.datasource.password=test

# ==================================
# =    HIBERNATE SEARCH CONFIG     =
# ==================================
# Use an in-memory Lucene directory for tests to ensure isolation and speed.
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-heap
spring.jpa.properties.hibernate.search.schema_management.strategy=create

# ==================================
# =      JPA/HIBERNATE CONFIG      =
# ==================================
# Explicitly set create-drop for the test environment.
spring.jpa.hibernate.ddl-auto=create-drop
