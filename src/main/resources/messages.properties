# --- API General Information ---
api.info.title=Cloud Support Automation API
api.info.version=1.0.0
api.info.description=An API for asynchronously executing infrastructure tasks like creating EC2 instances or running SSH commands.
api.info.termsOfService=http://swagger.io/terms/
api.info.license.name=Apache 2.0
api.info.license.url=http://springdoc.org

# --- Generic Descriptions ---
api.id.parameter.description=ID of the resource.
api.pageable.description=Pagination information (page, size, sort).

# --- User Controller ---
api.user.getAll.summary=Get all users
api.user.getAll.description=Retrieves a list of all users.

api.user.getById.summary=Get a user by ID
api.user.getById.description=Retrieves a single user by their unique ID.

api.user.create.summary=Create a new user
api.user.create.description=Creates a new user with the provided details.

api.user.update.summary=Update an existing user
api.user.update.description=Updates the details of an existing user by their ID.

api.user.delete.summary=Delete a user
api.user.delete.description=Deletes a user by their ID.

# --- Task Controller ---
api.task.create.summary=Create a new asynchronous task
api.task.create.description=Submits a new task for asynchronous execution (e.g., 'create_ec2', 'ssh_command'). The API returns immediately with a task ID.

api.task.getbyid.summary=Get a task by ID
api.task.getbyid.description=Retrieves the current status and result of a specific task by its unique ID.
api.task.id.description=ID of the task to be retrieved.

api.task.getall.summary=Get all tasks
api.task.getall.description=Retrieves a paginated list of all tasks.

# --- Generic API Responses ---
api.response.ok=Request successful.
api.response.created=Resource successfully created.
api.response.badrequest=Invalid request data provided.
api.response.notfound=The requested resource was not found.
api.response.conflict=A conflict occurred, such as a duplicate entry.
api.response.internalservererror=An unexpected internal server error occurred.
