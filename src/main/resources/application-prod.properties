# \u0434\u043B\u044F \u043F\u0440\u043E\u0434\u0430 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u043F\u0435\u0440\u0435\u043C\u0435\u043D\u043D\u044B\u0435 \u043E\u043A\u0440\u0443\u0436\u0435\u043D\u0438\u044F \u0438\u043B\u0438 \u0441\u0438\u0441\u0442\u0435\u043C\u0443 \u0443\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u044F \u0441\u0435\u043A\u0440\u0435\u0442\u0430\u043C\u0438
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

spring.datasource.url=jdbc:postgresql://your-production-db-host:5432/your_db_name
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver

# \u0414\u043B\u044F production-\u0441\u0440\u0435\u0434\u044B \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u0435\u0435 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C 'validate' \u0438\u043B\u0438 'none'.
# 'validate': \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0435\u0442, \u0441\u043E\u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0443\u0435\u0442 \u043B\u0438 \u0441\u0445\u0435\u043C\u0430 \u0441\u0443\u0449\u043D\u043E\u0441\u0442\u044F\u043C \u043F\u0440\u0438 \u0437\u0430\u043F\u0443\u0441\u043A\u0435, \u0438 \u0432\u044B\u0434\u0430\u0435\u0442 \u043E\u0448\u0438\u0431\u043A\u0443, \u0435\u0441\u043B\u0438 \u043D\u0435\u0442.
# 'none': \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0434\u0435\u043B\u0430\u0435\u0442. \u0418\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0442\u0435, \u0435\u0441\u043B\u0438 \u0443\u043F\u0440\u0430\u0432\u043B\u044F\u0435\u0442\u0435 \u043C\u0438\u0433\u0440\u0430\u0446\u0438\u044F\u043C\u0438 \u0441\u0445\u0435\u043C\u044B \u0441 \u043F\u043E\u043C\u043E\u0449\u044C\u044E \u0432\u043D\u0435\u0448\u043D\u0435\u0433\u043E \u0438\u043D\u0441\u0442\u0440\u0443\u043C\u0435\u043D\u0442\u0430, \u0442\u0430\u043A\u043E\u0433\u043E \u043A\u0430\u043A Flyway \u0438\u043B\u0438 Liquibase.
spring.jpa.hibernate.ddl-auto=update

# \u041E\u0442\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435 \u043F\u043E\u0434\u0440\u043E\u0431\u043D\u043E\u0433\u043E \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F SQL \u0432 production-\u0441\u0440\u0435\u0434\u0435 \u0434\u043B\u044F \u043F\u043E\u0432\u044B\u0448\u0435\u043D\u0438\u044F \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u0438 \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E\u0441\u0442\u0438.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# \u042D\u0442\u0438 \u0441\u0432\u043E\u0439\u0441\u0442\u0432\u0430 \u043A\u043E\u043D\u0444\u0438\u0433\u0443\u0440\u0438\u0440\u0443\u044E\u0442 \u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044C\u0441\u043A\u0438\u0439 \u043F\u0443\u043B \u043F\u043E\u0442\u043E\u043A\u043E\u0432 \u0434\u043B\u044F @Async \u0437\u0430\u0434\u0430\u0447.
# \u042D\u0442\u0438 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F \u0434\u043E\u043B\u0436\u043D\u044B \u0431\u044B\u0442\u044C \u043D\u0430\u0441\u0442\u0440\u043E\u0435\u043D\u044B \u043D\u0430 \u043E\u0441\u043D\u043E\u0432\u0435 \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432 production-\u0441\u0440\u0435\u0434\u044B \u0438 \u043E\u0436\u0438\u0434\u0430\u0435\u043C\u043E\u0439 \u043D\u0430\u0433\u0440\u0443\u0437\u043A\u0438.
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=Prod-AsyncTask-
