api.response.ok=Запрос успешно выполнен.
api.response.created=Ресурс успешно создан.
api.response.badrequest=Предоставлены неверные данные для запроса.
api.response.notfound=Запрошенный ресурс не найден.
api.response.conflict=Произошел конфликт, например, дублирующаяся запись.
