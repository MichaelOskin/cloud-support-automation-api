# --- Общая информация об API ---
api.info.title=API Автоматизации Облачной Поддержки
api.info.version=1.0.0
api.info.description=API для асинхронного выполнения инфраструктурных задач, таких как создание EC2-инстансов или запуск SSH-команд.
api.info.termsOfService=http://swagger.io/terms/
api.info.license.name=Apache 2.0
api.info.license.url=http://springdoc.org

# --- Общие описания ---
api.id.parameter.description=Идентификатор ресурса.
api.pageable.description=Информация о пагинации (page, size, sort).

# --- Контроллер пользователей ---
api.user.getAll.summary=Получить всех пользователей
api.user.getAll.description=Получает список всех пользователей.

api.user.getById.summary=Получить пользователя по ID
api.user.getById.description=Получает одного пользователя по его уникальному ID.

api.user.create.summary=Создать нового пользователя
api.user.create.description=Создает нового пользователя с предоставленными данными.

api.user.update.summary=Обновить существующего пользователя
api.user.update.description=Обновляет данные существующего пользователя по его ID.

api.user.delete.summary=Удалить пользователя
api.user.delete.description=Удаляет пользователя по его ID.

# --- Контроллер задач ---
api.task.create.summary=Создать новую асинхронную задачу
api.task.create.description=Отправляет новую задачу на асинхронное выполнение (например, 'create_ec2', 'ssh_command'). API немедленно возвращает ID задачи.

api.task.getbyid.summary=Получить задачу по ID
api.task.getbyid.description=Получает текущий статус и результат выполнения конкретной задачи по ее ID.
api.task.id.description=ID задачи для получения.

api.task.getall.summary=Получить все задачи
api.task.getall.description=Получает постраничный список всех задач.

